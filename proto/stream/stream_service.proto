syntax = "proto3";

package stream;

option go_package = "github.com/mrhumster/transcoder-service/gen/go/stream";

enum Status {
  STATUS_DRAFT = 0;
  STATUS_PROCESSING = 1;
  STATUS_READY = 2;
  STATUS_PUBLISHED = 3;
  STATUS_ERROR = 4;
  STATUS_UPLOADING = 5;
}

service StreamService {
  rpc UpdateStreamStatus(UpdateStreamStatusRequest) returns (UpdateStreamStatusResponse);
  rpc UpdateStreamMetadata(UpdateStreamMetadataRequest) returns (UpdateStreamMetadataResponse);
  rpc UpdateStreamProcessing(UpdateStreamProcessingRequest) returns (UpdateStreamProcessingResponse);
  rpc CompleteStreamExport(CompleteStreamExportRequest) returns (CompleteStreamExportResponse);
}

message UpdateStreamStatusRequest {
  string stream_uuid = 1;
  Status status = 2;
}

message UpdateStreamStatusResponse {
  bool updated = 1;
}

message UpdateStreamMetadataRequest {
  string stream_uuid = 1;
  int32 duration = 2;
  int64 size = 3;
  string format = 4;
  string resolution = 5;
  string recorded_at = 6;
  string location = 7;
  string camera = 8;
}

message UpdateStreamMetadataResponse {
  bool updated = 1;
}

message UpdateStreamProcessingRequest {
  string stream_uuid = 1;
  int32 progress = 2;
  repeated string steps = 3;
  string error = 4;
  string task = 5;
}

message UpdateStreamProcessingResponse {
  bool updated = 1;
}

// CompleteStreamExport reports the outcome of a single-file export back to
// stream-service, which owns the state row. success = false means error carries
// the reason and the row is marked failed.
message CompleteStreamExportRequest {
  string stream_uuid = 1;
  bool success = 2;
  int64 size = 3;
  string error = 4;
}

message CompleteStreamExportResponse {
  bool updated = 1;
}
