# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-service
  namespace: go-app
  labels:
    app: transcoder-service
spec:
  selector:
    matchLabels:
      app: transcoder-service
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: transcoder-service
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
      labels:
        app: transcoder-service
    spec:
      terminationGracePeriodSeconds: 300
      # GPU node (RX 5700 XT, AMD). Enable when the k3s agent with a GPU joins:
      # add its node label `gpu=true` and set:
      # nodeSelector:
      #   gpu: "true"
      # tolerations:
      # - key: "gpu"
      #   operator: "Exists"
      #   effect: "NoSchedule"
      containers:
        - name: transcoder-service
          image: xomrkob/transcoder-service:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            # root required for VAAPI /dev/dri access (homelab-only)
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: transcoder-service-config
            - configMapRef:
                name: go-app-config
            - secretRef:
                name: casbin-redis
            - secretRef:
                name: minio-credentials
          env:
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: GRPC_TLS_CERT
              value: "/tls/grpc/tls.crt"
            - name: GRPC_TLS_KEY
              value: "/tls/grpc/tls.key"
            - name: GRPC_TLS_CA
              value: "/tls/grpc/ca.crt"
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls/grpc
              readOnly: true
            - name: tmp-disk
              mountPath: /tmp
            - name: gpu-dri
              mountPath: /dev/dri
      volumes:
        - name: grpc-tls
          secret:
            secretName: grpc-transcoder-tls
        - name: tmp-disk
          emptyDir:
            sizeLimit: 10Gi
        - name: gpu-dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
      restartPolicy: Always
