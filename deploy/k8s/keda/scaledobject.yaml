apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transcoder-keda
  namespace: go-app
spec:
  scaleTargetRef:
    name: transcoder-service
  cooldownPeriod: 120
  maxReplicaCount: 1
  minReplicaCount: 0
  triggers:
    - type: redis
      authenticationRef:
        name: keda-redis-auth
      metadata:
        address: casbin-redis-master.go-app.svc.cluster.local:6379
        databaseIndex: "2"
        listName: "asynq:{default}:pending"
        listLength: "1"
    - type: redis
      authenticationRef:
        name: keda-redis-auth
      metadata:
        address: casbin-redis-master.go-app.svc.cluster.local:6379
        databaseIndex: "2"
        listName: "asynq:{default}:active"
        listLength: "1"
        type: "zset"
